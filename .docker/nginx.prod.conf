# Production nginx configuration for plc-platform-frontend.
#
# This container serves the compiled Angular SPA only. The platform reverse
# proxy owns /api and /ws, so there are no proxy_pass blocks here.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------------
    # Compression
    # ---------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ---------------------------------------------------------------------
    # Security headers (inherited by locations without their own add_header)
    # ---------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------------
    # Health check
    # ---------------------------------------------------------------------
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------------
    # Hashed build assets can be cached aggressively.
    # try_files with =404 avoids serving index.html for missing assets.
    # No add_header here so the server-level security headers are inherited.
    # ---------------------------------------------------------------------
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|ico|webp|map)$ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # The entrypoint document references hashed assets, so it must never be cached.
    location = /index.html {
        expires -1;
    }

    # ---------------------------------------------------------------------
    # SPA fallback: let the Angular router handle unknown paths.
    # ---------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}