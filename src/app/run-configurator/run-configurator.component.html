<div class="flex justify-content-end p-4">
  <p-button label="Create Run" severity="success" (onClick)="createRun()" [disabled]="!isConfigurationValid"></p-button>
</div>

<div>Creating run <input type="text" pInputText [(ngModel)]="runName" /></div>
<p-stepper [value]="1">
  <p-step-item [value]="1">
    <p-step>Audio Track</p-step>
    <p-step-panel>
      <ng-template #content let-activateCallback="activateCallback">
        <div class="flex flex-col pt-4 pr-4">
          <plc-audio-track-picker [(audioTracksSelection)]="audioTracksConfig" class="max-h-[600px] overflow-y-scroll">
          </plc-audio-track-picker>
        </div>
        <!-- <div class="py-6">
          <p-button label="Next" (onClick)="activateCallback(2)" />
        </div> -->
      </ng-template>
    </p-step-panel>
  </p-step-item>

  <p-step-item [value]="2">
    <p-step>Packet Loss Simulator</p-step>
    <p-step-panel>
      <ng-template #content let-activateCallback="activateCallback">
        <div class="flex flex-col pt-4 pr-4">
          <plc-module-configurator
            [moduleType]="ModuleType.PacketLossSimulator"
            [(modulesSelection)]="packetLossSimulatorsConfig"
          ></plc-module-configurator>
        </div>
        <!-- <div class="py-6">
          <p-button label="Next" (onClick)="activateCallback(2)" />
        </div> -->
      </ng-template>
    </p-step-panel>
  </p-step-item>

  <p-step-item [value]="3">
    <p-step>PLC Algorithm</p-step>
    <p-step-panel>
      <ng-template #content let-activateCallback="activateCallback">
        <div class="flex flex-col pt-4 pr-4">
          <plc-module-configurator
            [moduleType]="ModuleType.PLCAlgorithm"
            [(modulesSelection)]="PLCAlgorithmsConfig"
          ></plc-module-configurator>
        </div>
        <!-- <div class="flex py-6 gap-2">
          <p-button label="Back" severity="secondary" (onClick)="activateCallback(1)" />
          <p-button label="Next" (onClick)="activateCallback(3)" />
        </div> -->
      </ng-template>
    </p-step-panel>
  </p-step-item>

  <p-step-item [value]="4">
    <p-step>Output Analyser</p-step>
    <p-step-panel>
      <ng-template #content let-activateCallback="activateCallback">
        <div class="flex flex-col pt-4 pr-4">
          <plc-module-configurator
            [moduleType]="ModuleType.OutputAnalyser"
            [(modulesSelection)]="outputAnalysersConfig"
          ></plc-module-configurator>
        </div>
        <!-- <div class="py-6">
          <p-button label="Back" severity="secondary" (onClick)="activateCallback(2)" />
        </div> -->
      </ng-template>
    </p-step-panel>
  </p-step-item>
</p-stepper>
