<p-splitter styleClass=" min-h-[600px] mb-8" [panelSizes]="[20, 80]" [minSizes]="[15, 50]">
  <ng-template #panel>
    <div class="flex-col w-full h-full">
      <p-autocomplete
        [(ngModel)]="selectedModuleProxy"
        [suggestions]="availableModulesFilter"
        [optionLabel]="'name'"
        class="flex-1"
        (completeMethod)="searchModules($event)"
        (onSelect)="addModule(selectedModuleProxy)"
        appendTo="body"
        [dropdown]="true"
      />
      <ng-container *ngIf="modulesSelection.length > 0; else noModulesSelected">
        <p-listbox
          [options]="modulesSelection"
          [(ngModel)]="moduleFocus"
          [optionLabel]="'id'"
          class="w-full !min-h-full"
        >
          <ng-template let-item let-index="index" #item>
            <div class="flex flex-row flex-auto">
              <p>{{ item.name }}</p>
              <div class="flex-auto"></div>
              <p-button
                icon="pi pi-times"
                [rounded]="true"
                severity="danger"
                [outlined]="true"
                size="small"
                (onClick)="$event.stopPropagation(); removeFromModulesSelection(index)"
              />
            </div>
          </ng-template>
        </p-listbox>
      </ng-container>
    </div>
  </ng-template>
  <ng-template #panel>
    <ng-container *ngIf="!isAnyCrossfadeModuleSelected">
      <ng-container *ngTemplateOutlet="moduleSettingsTemplate; context: { $implicit: this.moduleFocus }" />
    </ng-container>
    <ng-container *ngIf="isAnyCrossfadeModuleSelected">
      <p-splitter layout="vertical" [panelSizes]="[50, 50]">
        <ng-template #panel>
          <ng-container *ngTemplateOutlet="moduleSettingsTemplate; context: { $implicit: this.moduleFocus }" />
        </ng-template>
        <ng-template #panel>
          <p-splitter [panelSizes]="[20, 80]">
            <ng-template #panel>
              <p-listbox
                [options]="groupedCrossfadeModulesOfSelectedModule"
                [(ngModel)]="crossfadeModuleFocus"
                [optionLabel]="'id'"
                [group]="true"
                class="w-full !min-h-full"
              >
                <ng-template let-group #group>
                  <div class="flex items-center" *ngIf="(group.items ?? []).length > 0">
                    <span>{{ group.label }}</span>
                    <span>{{ group.items.length }}</span>
                  </div>
                </ng-template>

                <ng-template let-item let-index="index" #item>
                  <div class="flex flex-row flex-auto">
                    <p>{{ item.name }}</p>
                    <div class="flex-auto"></div>
                    <p-button
                      icon="pi pi-times"
                      [rounded]="true"
                      severity="danger"
                      [outlined]="true"
                      size="small"
                      (onClick)="$event.stopPropagation(); removeFromCrossfadeModulesSelection(item.id)"
                    />
                  </div>
                </ng-template>
              </p-listbox>
            </ng-template>
            <ng-template #panel>
              <ng-container
                *ngTemplateOutlet="moduleSettingsTemplate; context: { $implicit: this.crossfadeModuleFocus }"
              />
            </ng-template>
          </p-splitter>
        </ng-template>
      </p-splitter>
    </ng-container>
  </ng-template>
</p-splitter>

<ng-template #moduleSettingsTemplate let-selectedModule>
  <ng-container *ngIf="modulesSelection.length > 0 && selectedModule; else noModulesSelected">
    <div class="flex flex-col min-w-full">
      <div class="flex min-w-full text-xl p-2 sticky top-0 bg-black tracking-wide">
        {{ selectedModule?.name }}
      </div>
      <div class="w-full flex flex-col p-2 overflow-y-auto gap-2">
        <ng-container *ngFor="let param of selectedModule?.settings ?? []">
          <div class="w-full flex flex-row min-h-10">
            <p class="min-w-56 flex items-center">{{ param.name }}</p>

            <ng-container *ngIf="param.type === 'int'">
              <ng-template [ngTemplateOutlet]="intInput"></ng-template>
            </ng-container>

            <ng-container *ngIf="param.type === 'float'">
              <ng-template [ngTemplateOutlet]="floatInput"></ng-template>
            </ng-container>

            <ng-container *ngIf="param.type === 'str'">
              <ng-template [ngTemplateOutlet]="strInput"></ng-template>
            </ng-container>

            <ng-container *ngIf="param.type === 'bool'">
              <ng-template [ngTemplateOutlet]="boolInput"></ng-template>
            </ng-container>

            <ng-container *ngIf="param.type === 'Enum'">
              <ng-template [ngTemplateOutlet]="enumInput"></ng-template>
            </ng-container>

            <ng-container *ngIf="param.type === 'list_int'">
              <ng-template [ngTemplateOutlet]="listIntInput"></ng-template>
            </ng-container>

            <ng-container *ngIf="param.type === 'list_CrossfadeSettings'">
              <ng-template [ngTemplateOutlet]="listCrossfadeInput"></ng-template>
            </ng-container>

            <ng-template #intInput>
              <p-inputnumber class="flex-1" [(ngModel)]="param.value" mode="decimal" useGrouping="false" />
            </ng-template>

            <ng-template #strInput>
              <input class="flex-1" [(ngModel)]="param.value" />
            </ng-template>

            <ng-template #floatInput>
              <p-inputnumber
                class="flex-1"
                [(ngModel)]="param.value"
                mode="decimal"
                useGrouping="false"
                [minFractionDigits]="0"
                [maxFractionDigits]="5"
              />
            </ng-template>

            <ng-template #boolInput>
              <p-checkbox [(ngModel)]="param.value" binary="true" class="content-center"></p-checkbox>
            </ng-template>

            <ng-template #enumInput>
              <p-select
                [(ngModel)]="param.value"
                [options]="param.availableValues"
                class="flex-1"
                appendTo="body"
              ></p-select>
            </ng-template>

            <ng-template #listIntInput>
              <p-autocomplete
                [(ngModel)]="param.value"
                [suggestions]="suggestedBands"
                class="flex-1"
                (completeMethod)="searchBands($event)"
                appendTo="body"
                multiple
                typeahead="false"
                [dropdown]="true"
                type="number"
              ></p-autocomplete>
            </ng-template>

            <ng-template #listCrossfadeInput>
              <p-autocomplete
                [(ngModel)]="selectedCrossfadeModuleProxy"
                [suggestions]="availableCrossfadeModulesFilter"
                [optionLabel]="'name'"
                class="flex-1"
                (completeMethod)="searchCrossfadeModules($event)"
                (onSelect)="addCrossfadeModule(selectedCrossfadeModuleProxy, param.name)"
                appendTo="body"
                [dropdown]="true"
              ></p-autocomplete>
            </ng-template>
          </div>
        </ng-container>
      </div>
    </div>
  </ng-container>
</ng-template>

<ng-template #noModulesSelected>
  <div class="pt-10 flex justify-center h-full text-white/50">Select a module</div>
</ng-template>
