<div class="flex flex-col gap-4">
  <div class="flex gap-4 justify-center">
    <p-selectbutton
      [(ngModel)]="zoomLensSelectedChannel"
      [options]="channelOptions"
      size="small"
      (ngModelChange)="onChannelToggle()"
    ></p-selectbutton>
  </div>

  <div class="bg-surface">
    <p-chart
      [type]="'line'"
      [data]="zoomSegmentData"
      [options]="zoomSegmentOptions"
      [width]="'100%'"
      [height]="'400px'"
    />
  </div>
</div>
