@if (!chartsReady) {
  <p-skeleton width="auto" height="10rem"></p-skeleton>
}
<div style="width: 100%; height: 240px; margin-top: 1rem">
  @for (metric of analysisService.metrics.value; track metric; let i = $index) {
    <p-chart
      [type]="chartTypes[i]"
      [data]="chartData[i]"
      [options]="chartOptions[i]"
      [width]="'100%'"
      [height]="'400px'"
    />
  }
</div>
