@if (!this.metrics) {
  Select a Reconstructed track to analyze metrics
}

<p-multiselect
  [options]="metricsWithLabels"
  [(ngModel)]="displayMetrics"
  placeholder="Select Metrics"
  display="chip"
  styleClass="w-full"
  optionLabel="displayName"
  appendTo="body"
  [style]="{ display: metrics ? 'flex' : 'none' }"
>
  <ng-template pTemplate="item" let-option>
    {{ option | metricLabel }}
  </ng-template>
</p-multiselect>

<div #chartContainer>
  @for (chartData of chartData; track chartData; let i = $index) {
    <div [style]="{ display: displayMetricsIndexes.includes(i) ? 'block' : 'none' }">
      <p-divider></p-divider>
      <div>
        <div class="flex flex-row items-center justify-center w-full gap-3">
          <h1 class="font-sans text-xl">
            {{ metrics[i] | metricLabel }}
          </h1>
          <p-button
            type="button"
            (click)="configDrawerVisible = true"
            [rounded]="true"
            severity="secondary"
            icon="pi pi-info-circle"
            size="small"
          />
        </div>
        <p-chart
          [type]="chartTypes[i]"
          [data]="chartData"
          [options]="chartOptions[i]"
          [width]="'100%'"
          [height]="'400px'"
        />
      </div>
    </div>
  }
</div>

<plc-run-configuration-drawer
  [(visible)]="configDrawerVisible"
  [run]="analysisService.run.value"
  [focusedModules]="focusedOutputAnalyserModules"
/>
