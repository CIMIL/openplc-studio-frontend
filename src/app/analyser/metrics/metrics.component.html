<div #chartContainer style="width: 100%; height: 240px; margin-top: 1rem">
  @for (chartData of chartData; track chartData; let i = $index) {
    <p-chart
      [type]="chartTypes[i]"
      [data]="chartData"
      [options]="chartOptions[i]"
      [width]="'100%'"
      [height]="'400px'"
    />
  }
</div>
