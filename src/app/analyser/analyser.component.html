<div class="">
  <div class="py-4">
    <ng-container *ngIf="trackGroups && trackGroups.length > 0; else trackSelectSkeleton">
      <p-cascadeselect
        [ngModel]="selectedTrack"
        (onChange)="onTrackChange($event.value)"
        [options]="$any(trackGroups)"
        optionLabel="name"
        optionGroupLabel="originalTrack"
        [optionGroupChildren]="['reconstructedTracks']"
        [style]="{ minWidth: '14rem' }"
        placeholder="Select a track"
      />
    </ng-container>
  </div>
  <div>
    <plc-wavesurfer-wrapper></plc-wavesurfer-wrapper>
  </div>

  <div>
    <div class="flex-column gap-6">
      <div class="flex gap-4">
        <p-select
          [options]="sampleMaskNames"
          optionLabel="label"
          optionValue="value"
          [ngModel]="analysisService.selectedSampleMaskIndex.value"
          (ngModelChange)="analysisService.selectedSampleMaskIndex.next($event)"
        ></p-select>
        <p-toggle-button
          [(ngModel)]="sampleMaskSelectedChannel"
          offLabel="Left"
          onLabel="Right"
          (ngModelChange)="onChannelToggle()"
        ></p-toggle-button>
      </div>

      <div class="bg-surface">
        <p-chart
          [type]="'line'"
          [data]="zoomSegmentData"
          [options]="zoomSegmentOptions"
          [width]="'100%'"
          [height]="'600px'"
        />
      </div>
    </div>

    @if (!chartsReady) {
    <p-skeleton width="auto" height="10rem"></p-skeleton>
    }
    <div style="width: 100%; height: 240px; margin-top: 1rem">
      <ng-container *ngFor="let metric of metrics; let i = index">
        <p-chart
          [type]="chartTypes[i]"
          [data]="chartData[i]"
          [options]="chartOptions[i]"
          [width]="'100%'"
          [height]="'600px'"
        />
      </ng-container>
    </div>
  </div>

  <ng-template #trackSelectSkeleton>
    <p-skeleton width="auto" height="2.5rem"></p-skeleton>
  </ng-template>
</div>
