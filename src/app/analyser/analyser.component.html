<div class="">
  <p-dropdown
    [options]="originalTracks"
    optionLabel="name"
    placeholder="Select a track"
    [(ngModel)]="selectedTrack"
    (ngModelChange)="onTrackChange($event)"
  >
  </p-dropdown>
  <p-dropdown
    [options]="reconstructedTracks"
    optionLabel="name"
    placeholder="Select a track"
    [(ngModel)]="selectedTrack"
    (ngModelChange)="onTrackChange($event)"
  >
  </p-dropdown>
  <plc-wavesurfer-wrapper></plc-wavesurfer-wrapper>
</div>
