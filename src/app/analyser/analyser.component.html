<div class="">
  <div class="py-4">
    @if (analysisService.trackGroups.value && analysisService.trackGroups.value.length > 0) {
      <p-cascadeselect
        [ngModel]="analysisService.selectedTrackPlayback.value"
        (ngModelChange)="analysisService.selectedTrackPlayback.next($event)"
        [options]="$any(analysisService.trackGroups.value)"
        optionLabel="name"
        optionGroupLabel="originalTrack"
        [optionGroupChildren]="['reconstructedTracks']"
        [style]="{ minWidth: '14rem' }"
        placeholder="Select a track"
      />
    } @else {
      <p-skeleton width="auto" height="2.5rem"></p-skeleton>
    }
  </div>
  <div>
    <plc-wavesurfer-wrapper></plc-wavesurfer-wrapper>
  </div>

  @if (analysisService.selectedPacketBounds.value && analysisService.selectedPacketBounds.value.length > 0) {
    <plc-zoom-lens></plc-zoom-lens>
  }

  <plc-metrics></plc-metrics>
</div>

<ng-template #trackSelectSkeleton>
  <p-skeleton width="auto" height="2.5rem"></p-skeleton>
</ng-template>
